[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-two"
version = "0.1.0"
description = "Reference verifier for ATP receipt bundles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "cryptography>=41",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
artifact-two-verify = "artifact_two.cli:main"

[tool.setuptools.packages.find]
include = ["artifact_two*"]
