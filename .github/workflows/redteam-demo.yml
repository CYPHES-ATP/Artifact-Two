name: Red-team verifier demo

on:
 pull_request:
 push:
 branches:
 - main

jobs:
 redteam-demo:
 runs-on: ubuntu-latest

 steps:
 - name: Checkout
 uses: actions/checkout@v4

 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: "3.11"

 - name: Install package if needed
 run: |
 python -m pip install --upgrade pip
 if [ -f pyproject.toml ]; then python -m pip install -e .; fi
 if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

 - name: Run verifier red-team demo
 run: |
 python tools/redteam_demo.py --bundle examples/atp-photo-handoff/valid
